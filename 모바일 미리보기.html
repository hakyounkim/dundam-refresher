<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DF Console · 모바일 미리보기</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #0d0e10;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    gap: 20px; padding: 32px 16px 48px;
  }
  .head { text-align: center; color: #ECEFF2; }
  .head h1 { margin: 0 0 4px; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .head p { margin: 0; font-size: 12px; color: #8B95A1; }
  .devices { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .device { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .device-label { font-size: 11px; font-weight: 700; color: #6B7480; letter-spacing: 0.06em; text-transform: uppercase; }
  /* iPhone-ish bezel */
  .phone {
    width: 393px; height: 852px;
    background: #1a1b1e;
    border-radius: 52px;
    padding: 12px;
    box-shadow: 0 0 0 2px #303236, 0 30px 80px rgba(0,0,0,0.6);
    position: relative;
  }
  .phone::after {
    content: ''; position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 30px; background: #000; border-radius: 16px; z-index: 3;
  }
  .screen {
    width: 100%; height: 100%;
    border-radius: 40px; overflow: hidden;
    background: #121417; position: relative;
  }
  .screen iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <div class="head">
    <h1>DF Console · 모바일 미리보기</h1>
    <p>실제 폰 폭(393px)으로 렌더링됩니다. 검색·갱신·상세 모두 동작해요.</p>
  </div>
  <div class="devices">
    <div class="device">
      <span class="device-label">iPhone · 393 × 852</span>
      <div class="phone">
        <div class="screen">
          <iframe src="index.html?demo" title="DF Console mobile"></iframe>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
